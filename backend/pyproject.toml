[project]
name = "fragile-backend"
version = "0.1.0"
description = "Drama Manager service for Fragile (turn-based, LLM-driven, trainable modules)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "openai>=1.50",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

# A dependency group (not an extra) so a plain `uv sync` installs the test and lint tools.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "engine"]
