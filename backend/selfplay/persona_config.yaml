# Player persona generator: sampling parameters (selfplay.md §3). Edit here, then bump generator_version.

generator_version: 2

# HEXACO domains, standardised (mean 0, sd 1): H Honesty-Humility, E Emotionality, X eXtraversion,
# A Agreeableness, C Conscientiousness, O Openness to Experience.
dims: [H, E, X, A, C, O]

# Population intercorrelations of the six domains: meta-analytic self-report estimates, disattenuated
# (corrected for unreliability, because personas are latent traits, not questionnaire scores).
# Source: Moshagen, M., Thielmann, I., Hilbig, B. E., & Zettler, I. (2019). Meta-analytic investigations of
# the HEXACO Personality Inventory(-Revised): Reliability generalization, self-observer agreement,
# intercorrelations, and relations to demographic variables. Zeitschrift fuer Psychologie, 227(3), 186-194.
# https://doi.org/10.1027/2151-2604/a000377 . Table 1, left block, below the diagonal (self-ratings;
# 309 <= k <= 321 samples, N about 245,000). Values in parentheses there (not significantly different from
# zero) are kept as printed: H-X, E-C, A-C.
correlations:
  H-E: 0.15
  H-X: -0.01
  H-A: 0.42
  H-C: 0.21
  H-O: 0.15
  E-X: -0.19
  E-A: -0.10
  E-C: -0.03
  E-O: -0.06
  X-A: 0.20
  X-C: 0.23
  X-O: 0.17
  A-C: 0.08
  A-O: 0.13
  C-O: 0.13

# 30% of personas come from the tails: one or two domains forced into their top or bottom 15%.
# The rest of the vector is still drawn from the population distribution (rejection sampling), so the
# correlations survive; each persona carries an importance weight back to the population.
tail:
  fraction: 0.30
  quantile: 0.15
  two_dim_share: 0.5

# Behaviour axes (selfplay.md §3.3): a weighted sum of domains plus noise, squashed to 0..1 by the normal CDF
# after dividing by its own standard deviation; `scale` then lowers an axis's whole range. INITIAL GUESSES,
# checked against play in selfplay.md §8.
noise_sd: 0.5
axes:
  curiosity:        { weights: { O: 0.6, X: 0.3 } }
  confrontation:    { weights: { A: -0.6, X: 0.3, E: 0.2 } }
  side_strength:    { weights: { A: 0.4, C: 0.4 } }
  honesty_to_nora:  { weights: { H: 0.7, C: 0.2 } }
  leave:            { weights: { E: 0.5, X: -0.4 }, scale: 0.1 }
  compliance:       { weights: { A: 0.5, X: 0.3 } }
  verbosity:        { weights: { X: 0.7 } }
  violation_rate:   { weights: { C: -0.7 }, scale: 0.15 }

# Rendering: an axis is "low" below this, "high" above 1 - this; mid axes are not written on the card.
bucket_edge: 0.33
max_rules: 4
# the adjectives come from the most extreme domains, at least this far from the mean
adjective_min_z: 0.6
max_adjectives: 3

# how strongly a goal follows the player's axes: weight = exp(strength * affinity . (axis - 0.5))
goal_affinity_strength: 6

side: { julian: 0.3333, mia: 0.3333, none: 0.3334 }
# after the truth comes out: probabilities proportional to [honesty^p, (1 - honesty)^p, hesitate]; the power
# makes the stance follow honesty more closely (a smooth, dishonest player rarely calls the police)
stance_power: 2
stance_hesitate: 0.2

# Lines held back from the opening card and added once their trigger fires (selfplay.md §3.4). The runner
# checks the condition against the engine state after every turn.
triggers:
  truth_out: "has(revealed, 'leo_dead')"

style:
  input_mode_single: 0.7      # the rest fill the channels
  temperature: [0.7, 1.0]
  female: 0.5

names: [Alex, Ali, Andy, Ari, Ash, Avery, Bailey, Blair, Blake, Bobbie, Brett, Brook, Cameron, Carey, Casey, Charlie, Chris, Cody, Corey, Dakota, Dale, Dana, Darcy, Devon, Drew, Eden, Elliot, Ellis, Emerson, Emery, Evan, Finley, Francis, Frankie, Gale, Glenn, Gray, Harley, Harper, Hayden, Hunter, Indy, Jaden, Jamie, Jesse, Jo, Jody, Jordan, Jules, Justice, Kai, Kelly, Kendall, Kerry, Kim, Kit, Lane, Lee, Lesley, Logan, Lou, Lynn, Marley, Max, Mel, Merritt, Micah, Morgan, Murphy, Nat, Nicky, Noel, Oakley, Pat, Perry, Parker, Peyton, Phoenix, Quinn, Ray, Reese, Remy, Riley, Robin, Rory, Rowan, Ryan, Sage, Sam, Sasha, Shay, Sidney, Skyler, Spencer, Stevie, Sutton, Tatum, Taylor, Terry, Toby]
